<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 14px;
      }
      h3 { margin: 0 0 12px; font-size: 16px; }
      .counter {
        font-size: 13px;
        color: #666;
        margin-bottom: 8px;
      }
      .progress {
        height: 4px;
        background: #eee;
        border-radius: 2px;
        margin-bottom: 12px;
        overflow: hidden;
      }
      .progress .bar {
        height: 100%;
        background: #1a73e8;
        border-radius: 2px;
        transition: width 0.3s;
      }
      .table-wrap {
        max-height: 320px;
        overflow-y: auto;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        position: sticky;
        top: 0;
        background: #f5f5f5;
        text-align: left;
        padding: 6px 8px;
        border-bottom: 2px solid #ddd;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #666;
      }
      td {
        padding: 5px 8px;
        border-bottom: 1px solid #eee;
        vertical-align: top;
      }
      tr.pending td { color: #999; }
      tr.ok td { color: #2a7d2f; }
      tr.err td { color: #c00; }
      tr.skip td { color: #b07d00; }
      .col-num { width: 30px; text-align: center; }
      .col-title { width: 40%; }
      .col-status { width: 80px; text-align: center; }
      .col-code { width: 60px; text-align: center; }
      .col-error { }
      .hidden { display: none !important; }
      .summary {
        margin-top: 12px;
        padding: 10px;
        border-radius: 4px;
        background: #f0f6ff;
        font-size: 13px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <h3>Publish to Curated</h3>
    <div id="counter" class="counter"></div>
    <div class="progress"><div id="bar" class="bar" style="width:0"></div></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-num">#</th>
            <th class="col-title">Title</th>
            <th class="col-status">Status</th>
            <th class="col-code">Code</th>
            <th class="col-error">Error</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="summary" class="summary hidden"></div>

    <script>
      var total = 0;
      var done = 0;
      var failed = 0;
      var skipped = 0;
      var links = [];
      var skipItems = [];
      var tbody = document.getElementById("tbody");
      var counterEl = document.getElementById("counter");
      var barEl = document.getElementById("bar");
      var summaryEl = document.getElementById("summary");

      function addRow(num, title, status, code, error, cls) {
        var tr = document.createElement("tr");
        if (cls) tr.className = cls;
        tr.innerHTML =
          '<td class="col-num">' + num + "</td>" +
          '<td class="col-title">' + escapeHtml(title) + "</td>" +
          '<td class="col-status">' + status + "</td>" +
          '<td class="col-code">' + (code || "") + "</td>" +
          '<td class="col-error">' + escapeHtml(error || "") + "</td>";
        tbody.appendChild(tr);
        var wrap = tbody.parentElement;
        wrap.scrollTop = wrap.scrollHeight;
        return tr;
      }

      function escapeHtml(s) {
        var div = document.createElement("div");
        div.textContent = s;
        return div.innerHTML;
      }

      function updateProgress() {
        var pct = total > 0 ? Math.round((done + failed) / total * 100) : 0;
        counterEl.textContent = (done + failed) + " / " + total + " links  —  " + pct + "%";
        barEl.style.width = pct + "%";
      }

      function finish() {
        summaryEl.className = "summary";
        var html = "<b>Publishing complete.</b><br>";
        html += "✓ Published: " + done + "<br>";
        if (failed > 0) html += '<span style="color:#c00">✗ Failed: ' + failed + "</span><br>";
        if (skipped > 0) html += '<span style="color:#b07d00">⊘ Skipped: ' + skipped + "</span>";
        if (skipItems.length > 0) {
          html += "<br><b>Skipped before sending:</b><br>";
          for (var i = 0; i < skipItems.length; i++) {
            html += "• " + skipItems[i].title + " — " + skipItems[i].reason + "<br>";
          }
        }
        summaryEl.innerHTML = html;
      }

      function processNext() {
        if (links.length === 0) {
          finish();
          return;
        }
        var link = links.shift();
        var idx = done + failed + 1;
        var row = addRow(idx, link.title, "⏳", "", "", "pending");

        google.script.run
          .withSuccessHandler(function(result) {
            if (result.success) {
              done++;
              row.children[2].textContent = "✓";
              row.children[3].textContent = result.httpCode || "";
              row.className = "ok";

              google.script.run
                .withSuccessHandler(function() {
                  updateProgress();
                  processNext();
                })
                .withFailureHandler(function(err) {
                  row.children[4].textContent = "Sheet write failed: " + err.message;
                  updateProgress();
                  processNext();
                })
                .markRowPublished(link.row);
            } else {
              failed++;
              row.children[2].textContent = "✗";
              row.children[3].textContent = result.httpCode || "";
              row.children[4].textContent = result.error || "Unknown error";
              row.className = "err";
              updateProgress();
              processNext();
            }
          })
          .withFailureHandler(function(err) {
            failed++;
            row.children[2].textContent = "✗";
            row.children[3].textContent = "—";
            row.children[4].textContent = "RPC failed: " + err.message;
            row.className = "err";
            updateProgress();
            processNext();
          })
          .postLinkToCurated(link);
      }

      function start() {
        google.script.run
          .withSuccessHandler(function(result) {
            links = result.links;
            skipItems = result.skipped;
            skipped = skipItems.length;
            total = links.length + skipped;

            if (total === 0) {
              counterEl.textContent = "Nothing to publish.";
              finish();
              return;
            }

            counterEl.textContent = "0 / " + total + " links";

            for (var i = 0; i < skipItems.length; i++) {
              skipped++;
              addRow("—", skipItems[i].title, "⊘", "", skipItems[i].reason, "skip");
            }

            processNext();
          })
          .withFailureHandler(function(err) {
            counterEl.textContent = "Error: " + err.message;
          })
          .getLinksToPublish();
      }

      start();
    </script>
  </body>
</html>
